<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="حكايات عربية تربط عائلات الكلمات الإنجليزية بجذورها، مع تدريب وتكرار متباعد واختبار شامل.">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حكايات العائلات">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>حكايات العائلات الإنجليزية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: a lexicon — each Latin root is an entry; each word hangs as a headword in the start margin beside its paragraph. */
:root{
  --paper:#f4f5f1; --card:#ffffff; --ink:#1c2333; --muted:#5b6274; --line:#d8dbe2;
  --lapis:#2846a6; --lapis-soft:#e6ebfa; --verd:#0d7a69; --verd-soft:#dff2ee;
  --ochre:#a86d12; --ochre-soft:#f7ecd8; --good:#23784a; --good-soft:#e1f3e8; --bad:#b4322c; --bad-soft:#fae5e3;
  --f-display:"Aref Ruqaa","Noto Naskh Arabic",serif;
  --f-body:"Noto Naskh Arabic","IBM Plex Sans Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --f-en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161f; --card:#18202c; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3343;
  --lapis:#91a9ff; --lapis-soft:#1f2a48; --verd:#4fd0b4; --verd-soft:#143430;
  --ochre:#e2ad4c; --ochre-soft:#3a2d16; --good:#63cf8f; --good-soft:#163524; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161f; --card:#18202c; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3343;
  --lapis:#91a9ff; --lapis-soft:#1f2a48; --verd:#4fd0b4; --verd-soft:#143430;
  --ochre:#e2ad4c; --ochre-soft:#3a2d16; --good:#63cf8f; --good-soft:#163524; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2}
.brand span{font-family:var(--f-latin);font-size:.8rem;color:var(--muted);letter-spacing:.12em;direction:ltr}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
.secs{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;background:var(--card)}
.secs button{font:600 .85rem var(--f-ui);background:none;border:0;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer;min-width:44px}
.secs button[aria-pressed="true"]{background:var(--ochre-soft);color:var(--ochre)}
nav.tabs button{font:500 .95rem var(--f-ui);background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.3}
h2{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{font:600 .95rem var(--f-ui);border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--r);cursor:pointer;line-height:1.4}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
select{font:500 .95rem var(--f-ui);padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.en,.latin,.word,.px,.root-t{unicode-bidi:isolate}
.en{font-family:var(--f-en);font-weight:500;direction:ltr}
.word{font-family:var(--f-en);font-weight:600;letter-spacing:.03em;color:var(--lapis);direction:ltr;background:none;border:0;padding:0;font-size:inherit;cursor:pointer;border-bottom:1px dotted currentColor}
.px{font-family:var(--f-en);font-weight:600;color:var(--verd);background:var(--verd-soft);padding:0 6px;border-radius:4px;direction:ltr;font-size:.92em}
.root-t{font-family:var(--f-latin);font-weight:700;letter-spacing:.06em;color:var(--ochre);direction:ltr}
.latin{font-family:var(--f-en);font-style:italic;color:var(--muted);direction:ltr}

/* Today */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;padding-block:8px 24px;border-bottom:1px solid var(--line)}
.hero p.lead{font-family:var(--f-body);font-size:1.1rem;color:var(--muted);max-width:60ch;margin-top:8px}
.due{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.due .n{font:600 2.6rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.due .n small{font-size:1rem;color:var(--muted);font-weight:500;margin-inline-start:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:20px}
.stat{padding:12px 0;border-top:2px solid var(--ink)}
.stat b{display:block;font:600 1.5rem/1.2 var(--f-ui);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fam{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fam .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fam .t .root-t{font-size:1.05rem}
.fam .t .core{font-family:var(--f-display);font-size:1.15rem}
.boxes{display:flex;gap:3px;direction:ltr}
.boxes i{flex:1;height:7px;border-radius:2px;background:var(--line)}
.boxes i[data-b="1"]{background:var(--bad)} .boxes i[data-b="2"]{background:var(--ochre)} .boxes i[data-b="3"]{background:#c9a43a}
.boxes i[data-b="4"]{background:var(--verd)} .boxes i[data-b="5"]{background:var(--good)}
.fam .acts{display:flex;gap:6px;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:7px;border-radius:2px;margin-inline-end:5px;vertical-align:middle;background:var(--line)}

/* Stories */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .82rem var(--f-latin);letter-spacing:.05em;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;direction:ltr}
.chip[aria-pressed="true"]{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ochre)}
.entry-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding-block:20px 8px;border-bottom:1px solid var(--line)}
.entry-head .big{font-family:var(--f-latin);font-size:clamp(2rem,6vw,3.2rem);font-weight:700;letter-spacing:.08em;color:var(--ochre);direction:ltr;line-height:1}
.entry-head .core{font-family:var(--f-display);font-size:1.8rem}
.entry-head .lat{font-family:var(--f-en);font-style:italic;color:var(--muted);direction:ltr}
.story{font-family:var(--f-body);font-size:1.12rem;line-height:2.05}
.story .intro{padding-block:16px;max-width:68ch}
.lex{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0 24px;border-top:1px solid var(--line)}
.lex>div{padding-block:14px;border-bottom:1px solid var(--line);min-width:0}
.lex .hw{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lex .hw .word{font-size:1.05rem;border:0}
.lex .hw .pxm{font-family:var(--f-ui);font-size:.82rem;color:var(--muted)}
.story .image{font-family:var(--f-body);font-size:1.02rem;color:var(--muted);padding-top:12px;max-width:68ch}
.story .image b{color:var(--ochre);font-family:var(--f-ui);font-size:.9rem;font-weight:600;margin-inline-end:6px}
.how{margin-top:8px;font-family:var(--f-ui);font-size:.9rem;line-height:1.8}
.how summary{cursor:pointer;color:var(--lapis);width:max-content;max-width:100%}
.how .chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:8px}
.how .chain span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px}
.how .chain i{font-style:normal;color:var(--muted)}
.how .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;color:var(--muted)}
.how .bt{border-radius:999px;padding:0 10px;font-weight:600;font-size:.82rem}
.how .bt.doc{background:var(--good-soft);color:var(--good)}
.how .bt.shift{background:var(--verd-soft);color:var(--verd)}
.how .bt.interp{background:var(--ochre-soft);color:var(--ochre)}
.how .bt.meta{background:var(--lapis-soft);color:var(--lapis)}
.how .et{margin-top:6px;font-family:var(--f-body);font-size:.95rem;color:var(--ink)}
.how a{color:var(--muted)}
.story .closing{padding-block:16px;font-style:normal;color:var(--ink);max-width:68ch;border-bottom:1px solid var(--line)}
.sumhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.sum .it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sum .it .m{font-size:.92rem;color:var(--muted);font-family:var(--f-body)}
.sum .it .a{font-weight:600;transition:filter .2s}
.hide-ar .sum .it .a{filter:blur(6px);cursor:pointer;user-select:none}
.sum .it .a.show{filter:none}
.extra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{margin-bottom:8px}
.branches{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.branches div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.examline{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.02rem;line-height:1.6}
.note{background:var(--ochre-soft);border-radius:12px;padding:14px 18px;margin-top:16px;font-family:var(--f-body)}
.note b{color:var(--ochre)}
.speak{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.speak:hover{color:var(--lapis);border-color:var(--lapis)}
.speak svg{width:14px;height:14px}

/* Quiz */
.quiz{max-width:680px;margin:0 auto}
.qbar{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar .track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:14px;display:flex;flex-direction:column;gap:16px}
.qkind{font-size:.8rem;letter-spacing:.02em;color:var(--verd);font-weight:600}
.qprompt{font-family:var(--f-body);font-size:1.25rem;line-height:1.9}
.qprompt .big{font-family:var(--f-en);font-weight:600;font-size:1.7rem;letter-spacing:.04em;color:var(--lapis);direction:ltr;unicode-bidi:isolate}
.qprompt .sent{display:block;font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.15rem;line-height:1.7;margin-top:6px}
.qprompt .sent u{text-decoration:none;border-bottom:2px solid var(--ink);display:inline-block;min-width:70px}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opt{font:500 1.02rem var(--f-ui);text-align:start;background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;min-height:52px;line-height:1.5}
.opt.en-opt{font-family:var(--f-en);font-weight:600;letter-spacing:.03em;direction:ltr;text-align:left}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;font-family:var(--f-body);display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb .v{font-family:var(--f-ui);font-weight:600}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb details summary{cursor:pointer;color:var(--muted);font-family:var(--f-ui);font-size:.9rem}
.fb details p{margin-top:6px;line-height:1.95}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.keys{font-size:.78rem;color:var(--muted)}
.result{display:flex;flex-direction:column;gap:18px}
.score{font:600 3.2rem/1 var(--f-ui);font-variant-numeric:tabular-nums}
.bykind{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bykind div{border-top:2px solid var(--line);padding-top:8px;font-size:.9rem}
.bykind b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.mist{display:flex;flex-direction:column;gap:10px}
.mist .it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mist .it p{font-family:var(--f-body);line-height:1.95;margin-top:6px}

/* Flashcards */
.flash{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card3d{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:250px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer}
.card3d .w{font-family:var(--f-en);font-weight:600;font-size:2.1rem;letter-spacing:.05em;color:var(--lapis);direction:ltr}
.card3d .m{font-family:var(--f-body);font-size:1.15rem}
.card3d .a{font-size:1.4rem;font-weight:600}
.card3d .hint{font-size:.8rem;color:var(--muted)}

/* Prefix table */
.ptable{width:100%;border-collapse:collapse;font-size:.95rem}
.ptable th,.ptable td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable th{font-size:.8rem;color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
.ptable td .word{border:0;font-size:.9rem;margin-inline-end:8px}

footer.foot{border-top:1px solid var(--line);padding-block:14px;font-size:.82rem;color:var(--muted)}
footer.foot .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline-end:6px}
.dot.on{background:var(--good)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lex{grid-template-columns:1fr}
  .lex .hw{flex-direction:row;align-items:center;padding-bottom:0;border-bottom:0!important}
  .lex>div.para{padding-top:4px}
  .extra{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  h1{font-size:1.6rem}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  nav.tabs button{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand"><b>حكايات العائلات</b><span>RADICES LATINAE</span></div>
  <div class="secs" role="group" aria-label="المستوى">
    <button data-sec="a2">A2.1</button><button data-sec="b1">B1.1</button><button data-sec="b1_2">B1.2</button><button data-sec="b2_1">B2.1</button><button data-sec="tech">التقني</button>
  </div>
  <nav class="tabs" aria-label="الأقسام">
    <button data-tab="today">اليوم</button>
    <button data-tab="stories">الحكايات</button>
    <button data-tab="practice">التدريب</button>
    <button data-tab="exam">الاختبار الشامل</button>
    <button data-tab="prefixes">السوابق</button>
  </nav>
</div></header>
<main class="wrap" id="view" aria-live="polite"></main>
<footer class="foot"><div class="wrap">
  <span id="sync"><i class="dot"></i>تقدّمك محفوظ في هذا المتصفح</span>
  <label class="row" style="gap:6px">النطق:
    <select id="voiceSel" aria-label="مصدر النطق" style="padding:3px 8px;font-size:.82rem">
      <option value="file">تسجيل أمريكي (فوري)</option>
      <option value="browser">صوت المتصفح الأمريكي</option>
    </select></label>
  <span id="secInfo"></span>

<script>

const PX = new Set(["IN","IM","EX","E","DE","TRANS","SUB","SUP","SU","RE","PRO","CON","INTRO","INFRA","PLAT","PRE","CONTRA","VER","AD","A","SUPER","UN","BACK","LEGE","LEX","IR","‑IVE","‑ION","‑ABLE","‑IZE","‑ED","‑ING","‑MENT","MAIN","OB","OF","PER","DIS","DIF","SUF","SUS","SUC","AC","AT","AS","AP","COM","MULTI","INTER","DES","S","‑CY","‑ITY","‑ATE","‑URE","‑ARY","‑AL","‑ANT","‑ICE","‑IST"]);
const ROOTS = new Set(["PORT","SPECT","DUCE","DUCT","STRAIN","STRICT","STRINGENT","STRUCT","FORM","GEN","DICT","VAL","VAIL","TRAIN","VID","VIS","TECT","TRIEVE","TROVE","TRIVE","AUG","AUTH","AUCTOR","AUTOR","PRIV","GROUND","VIDEO","TAIN","FER","MIT","MISS","VEN","VENT","CAP","CEPT","CEIVE","PEND","PENS","TEND","TENS","CEED","CESS","SIST","STA","PLY","PLIC","MOV","MOT","PART","NAT","FIN","CHIEF","CIRC","SERV","MEMOR","SIGN","REG","RECT","JOUR"]);
function rich(text, fam){
  const fw = new Set(fam ? fam.words.map(w => w.w) : []);
  return esc(text).replace(/[A-Za-zÀ-ÿ‑][A-Za-zÀ-ÿ0-9‑'’\-]*(?:[ .][A-Za-zÀ-ÿ0-9$][A-Za-zÀ-ÿ0-9‑'’\-]*)*/g, run => {
    if (fw.has(run) || BY[run]) return `<button class="word" data-say="${run}" title="انطق">${run}</button>`;
    if (PX.has(run)) return `<bdi class="px" dir="ltr">${run}</bdi>`;
    if (ROOTS.has(run)) return `<span class="root-t">${run}</span>`;
    if (/^[A-Z][a-z]+$/.test(run) && fam && (run === fam.latin || /^(Portare|Spectare|Specere|Ducere|Educare|Educere|Stringere|Struere|Forma|Formare|Generare|Dicere|Valere|Trainer|Trahere|Videre|Tegere|Trover|Augere|Augmentum|Privus|Grund|Tenere|Ferre|Mittere|Venire|Capere|Premere|Pendere|Tendere|Cedere|Sistere|Stare|Plicare|Movere|Pars|Nasci|Finis|Caput|Circus|Cerchier|Servire|Servare|Memor|Signum|Designare|Regere|Diurnus|Jour|Mons|Certus|Vendere|Prae|Esse|Sedere|Mens)$/.test(run))) return `<span class="latin">${run}</span>`;

const PXPOOL = ["إلى الداخل","إلى الخارج","إلى الخلف / راجعًا","مرة أخرى","إلى الأمام","أمام","معًا","من تحت","تحت","من فوق","عبر","قبل","ضدّ","بعيدًا","نزع وإزالة","تمامًا","لا (نفي)","إلى (نحو)","صادق","مسطّح","قانون","وراء","اليد","تفرّق وانفصال","من أعلى إلى أسفل","على","كثير","بين","تقوية"];
const SIBS = [["إلى الخلف / راجعًا","مرة أخرى","تقوية"],["إلى الأمام","أمام","إلى (نحو)"],["من تحت","تحت"],["بعيدًا","نزع وإزالة","تمامًا","من أعلى إلى أسفل","تفرّق وانفصال"],["من فوق","فوق"],["إلى الداخل","على"]];
const sibOf = m => { const s = new Set([m]); SIBS.forEach(g => { if (g.includes(m)) g.forEach(x => s.add(x)); }); return [...s]; };
function others(x, n, field){
  const same = shuffle(x.f.words.filter(w => w.w !== x.w.w));
  const rest = shuffle(SALL.filter(a => a.f !== x.f).map(a => a.w));
  const out = [], seen = new Set([x.w[field]]);
  for (const w of same.concat(rest)) { if (out.length >= n) break; if (seen.has(w[field])) continue; seen.add(w[field]); out.push(w); }
  return out;
}
function qMeaning(x){ const o = others(x, 3, "ar"); return { kind: "المعنى", key: x.key, f: x.f, prompt: `ما معنى <span class="big">${x.w.w}</span>؟`, say: x.w.w, opts: shuffle([x.w.ar, ...o.map(w => w.ar)]), a: x.w.ar, en: false }; }
function qReverse(x){ const o = others(x, 3, "w"); return { kind: "الكلمة", key: x.key, f: x.f, prompt: `أيّ كلمة معناها: «${esc(x.w.ar)}»؟`, opts: shuffle([x.w.w, ...o.map(w => w.w)]), a: x.w.w, en: true }; }
function qImage(x){ const o = others(x, 3, "w"); return { kind: "الصورة", key: x.key, f: x.f, prompt: `أيّ كلمة ترسم هذه الصورة؟<br>«${esc(x.w.m)}»`, opts: shuffle([x.w.w, ...o.map(w => w.w)]), a: x.w.w, en: true }; }
function qPrefix(x){
  const p = x.w.px.split(" ").pop(), ex = new Set(sibOf(x.w.pxm));
  const d = pick(PXPOOL.filter(m => !ex.has(m)), 3);
  return { kind: "السابقة", key: x.key, f: x.f, prompt: `ما معنى <bdi class="px" dir="ltr">${p}</bdi> في <span class="big">${x.w.w}</span>؟`, say: x.w.w, opts: shuffle([x.w.pxm, ...d]), a: x.w.pxm, en: false };
}
function qCore(x){
  const d = pick([...new Set(FAMS.filter(f => f !== x.f && f.core !== x.f.core).map(f => f.core))], 3);
  return { kind: "العائلة", key: x.key, f: x.f, prompt: `<span class="big">${x.w.w}</span> من عائلة تدور حول:`, say: x.w.w, opts: shuffle([x.f.core, ...d]), a: x.f.core, en: false };
}
function qCloze(f, c){ return { kind: "السياق", key: null, f, prompt: `اختر الكلمة التي تكمل الجملة:<span class="sent">${esc(c.s).replace("___", "<u>&nbsp;</u>")}</span>`, opts: shuffle(c.o), a: c.a, en: true, after: { en: c.s.replace("___", c.a), ar: c.ar } }; }
function qOutsider(f, o){
  const m = pick(f.words.map(w => w.w).filter(w => w !== o.w), 3);
  return { kind: "الدخيل", key: null, f, prompt: `أيّ هذه الكلمات ليست من عائلة <span class="root-t">${f.root.split(" ")[0]}</span>؟`, opts: shuffle([o.w, ...m]), a: o.w, en: true, why: o.why };
}
function wordQ(x){
  const b = card(x.key).b;
  const types = b <= 1 ? [qMeaning, qImage, qMeaning] : b <= 3 ? [qMeaning, qImage, qReverse, qCore] : [qReverse, qImage, qCore];
  if (x.w.px && !x.w.px.startsWith("‑") && b >= 1) types.push(qPrefix);
  return pick(types, 1)[0](x);
}

  const xs = ALL.filter(a => a.f === f);
  let qs = xs.map(qMeaning).concat(xs.map(qImage));
  qs = pick(qs, Math.min(qs.length, 7));
  const pxs = xs.filter(x => x.w.px && !x.w.px.startsWith("‑"));
  qs = qs.concat(pick(pxs, 2).map(qPrefix), pick(xs, 1).map(qReverse), f.cloze.map(c => qCloze(f, c)), f.outsiders.map(o => qOutsider(f, o)));
  return shuffle(qs);
}
function startFamily(id){ const f = FAMILIES.find(x => x.id === id); runQuiz(famQuestions(f), { title: "عائلة " + f.root, srs: true, fam: f }); }
function startExam(n){
  const builders = [qMeaning, qReverse, qImage, qCore];
  let qs = pick(SALL, Math.round(n * .6)).map(x => pick(builders, 1)[0](x));
  qs = qs.concat(pick(SALL.filter(x => x.w.px && !x.w.px.startsWith("‑")), Math.round(n * .15)).map(qPrefix));
  qs = qs.concat(pick(FAMS.flatMap(f => f.cloze.map(c => qCloze(f, c))), Math.round(n * .2)));
  qs = qs.concat(pick(FAMS.flatMap(f => f.outsiders.map(o => qOutsider(f, o))), Math.max(2, Math.round(n * .1))));
  runQuiz(shuffle(qs).slice(0, n), { title: "الاختبار الشامل · " + SECTIONS[sec].name, srs: true, exam: true });
}

let quizActive = false;
function runQuiz(items, opt){
  quizActive = true;
  let i = 0, score = 0; const log = [], requeued = new Set();
  const total = () => items.length;
  function show(){
    const q = items[i];
    view.innerHTML = `
    <div class="quiz">
      <div class="qbar"><button class="btn ghost small" id="quit">إنهاء</button><span>${esc(opt.title)}</span><div class="track"><i style="width:${100 * i / total()}%"></i></div><span>${i + 1} من ${total()}</span></div>
      <div class="qcard">
        <div class="row" style="justify-content:space-between"><span class="qkind">${q.kind}</span>${q.say ? spk(q.say) : ""}</div>
        <div class="qprompt">${q.prompt}</div>
        <div class="opts">${q.opts.map((o, k) => `<button class="opt ${q.en ? "en-opt" : ""}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
        <div id="fb"></div>
        <div class="qnav"><span class="keys">اختصار: الأرقام 1–4 للاختيار، وEnter للتالي</span><button class="btn" id="next" hidden>التالي</button></div>
      </div>
    </div>`;
    $("#quit").onclick = finish;
    view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  }
  function answer(k){
    const q = items[i]; if (q.done) return; q.done = true;
    const chosen = q.opts[k], ok = chosen === q.a;
    if (ok) score++;
    log.push({ q, chosen, ok });
    if (opt.srs && q.key) grade(q.key, ok);
    if (!ok && opt.requeue && q.key && !requeued.has(q.key)) {
      requeued.add(q.key);
      const again = wordQ(BY[q.key]); again.retry = true;
      items.splice(Math.min(items.length, i + 4), 0, again);
    }
    view.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.a) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
    if (!opt.exam) $("#fb").innerHTML = feedback(q, ok);
    else { view.querySelectorAll(".opt").forEach(b => b.classList.remove("right", "wrong")); view.querySelectorAll(".opt")[k].style.borderColor = "var(--ink)"; }
    const n = $("#next"); n.hidden = false; n.textContent = i + 1 < total() ? "التالي" : "النتيجة"; n.onclick = next; n.focus();
  }
  function next(){ i++; if (i < total()) show(); else finish(); }
  function onKey(e){
    if (!quizActive) return;
    if (/^[1-4]$/.test(e.key)) { const b = view.querySelectorAll(".opt")[+e.key - 1]; if (b && !b.disabled) b.click(); }
    else if (e.key === "Enter") { const n = $("#next"); if (n && !n.hidden) { e.preventDefault(); n.click(); } }
  }
  document.addEventListener("keydown", onKey);
  function finish(){
    document.removeEventListener("keydown", onKey);
    quizActive = false;
    const done = log.length;
    if (opt.exam && done) { P.exams.push({ t: Date.now(), s: score, n: done, sec }); if (P.exams.length > 60) P.exams = P.exams.slice(-60); save(); }
    const kinds = {};
    log.forEach(l => { const k = l.q.kind; kinds[k] = kinds[k] || [0, 0]; kinds[k][1]++; if (l.ok) kinds[k][0]++; });
    const wrong = log.filter(l => !l.ok);
    const pct = done ? Math.round(100 * score / done) : 0;
    view.innerHTML = `
    <div class="quiz result">
      <span class="qkind">${esc(opt.title)}</span>
      <div class="row" style="align-items:baseline;gap:14px"><span class="score">${score} <small style="font-size:1.4rem;color:var(--muted)">من ${done}</small></span><span class="muted">${pct}٪ ${verdict(pct, done)}</span></div>
      ${done ? `<div class="bykind">${Object.entries(kinds).map(([k, v]) => `<div>${k}<b>${v[0]} من ${v[1]}</b></div>`).join("")}</div>` : ""}
      ${wrong.length ? `<h2>راجع هذه</h2><div class="mist">${wrong.map(l => mistake(l)).join("")}</div>` : (done ? `<p style="font-family:var(--f-body);font-size:1.1rem">لا أخطاء. ستعود هذه الكلمات إليك بعد أيام لتثبت.</p>` : "")}
      <div class="row"><button class="btn" id="home">إلى اليوم</button>${opt.fam ? `<button class="btn ghost" data-read="${opt.fam.id}">اقرأ الحكاية</button><button class="btn ghost" data-quiz="${opt.fam.id}">أعد الاختبار</button>` : ""}</div>
    </div>`;
    $("#home").onclick = () => go("today");
    bindCommon();
    window.scrollTo({ top: 0 });
  }
  show();
}
function verdict(p, n){ if (!n) return ""; if (p >= 90) return "· ممتاز"; if (p >= 75) return "· جيّد جدًّا"; if (p >= 60) return "· جيّد، وراجع ما أخطأت فيه"; return "· عُد إلى الحكايات ثم أعد المحاولة"; }
function explain(q){
  if (q.key) { const x = BY[q.key]; return `<span><button class="word" data-say="${x.w.w}">${x.w.w}</button>: ${esc(x.w.m)} ← <b>${esc(x.w.ar)}</b></span><details><summary>فقرتها من الحكاية</summary><p>${rich(x.w.p, x.f)}</p></details>`; }
  if (q.after) return `<span class="row" style="gap:8px;direction:ltr;justify-content:flex-start">${spk(q.after.en, "انطق الجملة")}<span class="examline">${esc(q.after.en)}</span></span><span>${esc(q.after.ar)}</span>`;
  if (q.why) return `<span><b class="en">${q.a}</b>: ${esc(q.why)}</span>`;
  return "";
}
function feedback(q, ok){ return `<div class="fb ${ok ? "ok" : "no"}"><span class="v">${ok ? "صحيح" : "الصواب: " + `<bdi>${esc(q.a)}</bdi>`}</span>${explain(q)}</div>`; }
function mistake(l){ const q = l.q; return `<div class="it"><div class="row" style="justify-content:space-between"><span class="qkind">${q.kind}</span><span class="muted" style="font-size:.85rem">اخترت: <bdi>${esc(l.chosen)}</bdi> · الصواب: <bdi><b>${esc(q.a)}</b></bdi></span></div><div class="qprompt" style="font-size:1.05rem">${q.prompt}</div><div class="fb no" style="margin-top:8px">${explain(q)}</div></div>`; }

/* ---------- flashcards ---------- */
function startFlash(id){
  const f = FAMILIES.find(x => x.id === id);
  let deck = shuffle(f.words), i = 0, flipped = false, known = 0;
  quizActive = true;
  function show(){
    if (i >= deck.length) { quizActive = false; view.innerHTML = `<div class="flash"><h2>انتهت بطاقات ${f.root}</h2><p class="muted">تذكّرت ${known} من ${deck.length}.</p><div class="row"><button class="btn" data-quiz="${f.id}">اختبر العائلة</button><button class="btn ghost" data-flash="${f.id}">أعد البطاقات</button><button class="btn ghost" id="home">إلى اليوم</button></div></div>`; $("#home").onclick = () => go("today"); bindCommon(); return; }
    const w = deck[i];
    view.innerHTML = `
    <div class="flash">
      <div class="qbar"><button class="btn ghost small" id="quit">إنهاء</button><span>بطاقات ${f.root}</span><div class="track"><i style="width:${100 * i / deck.length}%"></i></div><span>${i + 1} من ${deck.length}</span></div>
      <div class="card3d" id="fc" role="button" tabindex="0" aria-label="اقلب البطاقة">
        <span class="w">${w.w}</span>${w.px ? `<bdi class="px" dir="ltr">${w.px}</bdi>` : ""}
        ${flipped ? `<span class="m">${esc(w.m)}</span><span class="a">${esc(w.ar)}</span>` : `<span class="hint">تذكّر الصورة والمعنى، ثم اضغط لتقلب البطاقة</span>`}
      </div>
      <div class="row" style="justify-content:center">${spk(w.w)}${flipped ? `<button class="btn ghost" id="no">لم أتذكّر</button><button class="btn" id="yes">تذكّرت</button>` : `<button class="btn" id="flip">اقلب</button>`}</div>
      ${flipped ? `<details class="panel"><summary class="muted" style="cursor:pointer">فقرتها من الحكاية</summary><p style="font-family:var(--f-body);line-height:2;margin-top:8px">${rich(w.p, f)}</p></details>` : ""}
    </div>`;
    $("#quit").onclick = () => { quizActive = false; go("today"); };
    const flip = () => { flipped = true; show(); };
    $("#fc").onclick = () => { if (!flipped) flip(); };
    $("#fc").onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !flipped) { e.preventDefault(); flip(); } };
    if (!flipped) $("#flip").onclick = flip;
    else { $("#yes").onclick = () => { grade(w.w, true); known++; i++; flipped = false; show(); }; $("#no").onclick = () => { grade(w.w, false); i++; flipped = false; show(); }; }
  }
  show();
}
